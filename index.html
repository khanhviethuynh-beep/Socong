<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sổ Công">
<meta name="theme-color" content="#0f5c8c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Safe Lock – Sổ Công Thợ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Cùng phong cách app Báo Giá Nhanh: header xanh, thẻ trắng, thanh tổng cố định, tab dưới, phiếu A4 xem trước */
:root{--pri:#0f5c8c;--pri2:#0b4a72;--acc:#f2a33a;--bg:#eef2f6;--card:#fff;--txt:#1d2733;--mut:#6b7785;--line:#dde3ea;--red:#c8423b;--ok:#2e8b57;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:15px}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
.brand{display:flex;align-items:center;gap:9px}
.emb{width:34px;height:34px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.emb img{width:26px;height:26px;object-fit:contain}
.av{border-radius:50%;object-fit:cover;flex:0 0 auto;background:#e2eef6;color:var(--pri);display:inline-flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.wrow .who,.wk .who{display:flex;align-items:center;gap:10px;min-width:0}
.photo-pick{display:flex;align-items:center;gap:14px;margin-top:4px}
.photo-pick .av{width:84px;height:84px;font-size:28px}
#sync{font-size:11.5px;opacity:.9;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:20px;white-space:nowrap}
main{padding:12px 12px calc(160px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,40,60,.06)}
.card h2{font-size:14px;margin:0 0 10px;color:var(--pri);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
label{display:block;font-size:12.5px;color:var(--mut);margin:8px 0 4px;font-weight:500}
input,textarea,select{width:100%;font:inherit;font-size:16px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fafbfc;color:var(--txt);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--pri);background:#fff}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:600;font-size:15px;border:0;border-radius:11px;padding:11px 14px;cursor:pointer;background:#e3eaf1;color:var(--txt)}
.btn.pri{background:var(--pri);color:#fff}.btn.acc{background:var(--acc);color:#2b1a00}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px dashed #b9cbd9;width:100%}
.btn.red{background:#fbe9e7;color:var(--red)}
.btn.sm{padding:7px 11px;font-size:13.5px;border-radius:9px}
.btn.full{width:100%}
.btn:active{transform:scale(.98)}
.btn:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:#fafbfc;color:var(--txt);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{border:1px solid var(--line);background:#fafbfc;border-radius:10px;padding:10px 6px;font:inherit;font-size:13.5px;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--pri);border-color:var(--pri);color:#fff}
/* nhật ký */
.day{font-size:12.5px;font-weight:700;color:var(--mut);margin:14px 4px 6px;text-transform:uppercase;letter-spacing:.3px}
.ent{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:12px;padding:11px 12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(20,40,60,.06);width:100%;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.ent .tg{font-size:11px;font-weight:700;border-radius:10px;padding:2px 8px;white-space:nowrap;margin-top:2px}
.tg.job{background:#e2eef6;color:var(--pri)}.tg.thu{background:#fbe9e7;color:var(--red)}.tg.chi{background:#e6f3ec;color:var(--ok)}
.ent .mn{flex:1;min-width:0}.ent .mn b{display:block;font-size:14.5px}
.ent .mn span{font-size:12.5px;color:var(--mut);overflow-wrap:anywhere}
.ent .am{text-align:right;font-weight:700;white-space:nowrap;font-size:14.5px}
.ent .am small{display:block;font-weight:500;font-size:12px}
.plus{color:var(--ok)}.minus{color:var(--red)}
.empty{text-align:center;color:var(--mut);padding:34px 16px;line-height:1.55}
.empty b{display:block;color:var(--txt);font-size:16px;margin-bottom:4px}
/* chốt công */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:#f4f7fa;border-radius:10px;padding:10px}
.tile small{display:block;font-size:12px;color:var(--mut)}
.tile b{font-size:17px}
.tile.big{grid-column:1/-1;background:#e2eef6}
.tile.big b{font-size:22px;color:var(--pri)}
.wk .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.wk .h b{font-size:16px}.wk .h span{font-size:12.5px;color:var(--mut)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tags span{font-size:12px;background:#f4f7fa;border:1px solid var(--line);border-radius:7px;padding:2px 8px}
.totals{font-size:14px}.totals div{display:flex;justify-content:space-between;padding:4px 0}
.totals .g{font-weight:700;font-size:16px;color:var(--pri);border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
.words{font-size:13px;color:var(--mut);font-style:italic;margin-top:2px}
.wk .a{display:flex;gap:6px;margin-top:10px}.wk .a .btn{flex:1}
.hint{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.5}
/* thợ, giá */
.wrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;font:inherit;color:inherit;text-align:left}
.wrow:last-child{border-bottom:0}
.wrow b{display:block}.wrow span{font-size:12.5px;color:var(--mut)}
.off{font-size:11px;background:#fbe9e7;color:var(--red);border-radius:8px;padding:1px 7px;margin-left:6px;font-weight:600}
.prod{display:grid;grid-template-columns:1fr 104px 58px 30px;gap:6px;margin-bottom:6px;align-items:center}
.prod input{padding:8px;font-size:14.5px}.prod button{border:0;background:none;color:var(--red);font-size:20px;cursor:pointer}
.logo-prev{display:flex;align-items:center;gap:10px;margin-top:6px}.logo-prev img{max-height:56px;max-width:140px;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff}
/* form công */
.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fcfdfe;position:relative}
.item .no{position:absolute;top:-9px;left:10px;background:var(--pri);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 8px}
.item .del{position:absolute;top:4px;right:4px;border:0;background:none;color:var(--red);font-size:20px;padding:4px 8px;cursor:pointer}
.item select{padding-right:34px;font-weight:600}
.item .lt{text-align:right;font-size:13.5px;color:var(--mut);margin-top:6px}.item .lt b{color:var(--txt)}
/* thanh tổng + tab */
.sumbar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:15;background:#fff;border-top:1px solid var(--line);padding:9px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 -4px 14px rgba(20,40,60,.07)}
.sumbar .t{flex:1;line-height:1.2;min-width:0}.sumbar .t small{color:var(--mut);font-size:12px}.sumbar .t b{display:block;font-size:19px;color:var(--pri)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:16;background:#fff;border-top:1px solid var(--line);display:flex;height:calc(62px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;font:inherit;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--pri);font-weight:600}
/* màn nhập (full screen) */
.pane{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
.pane.on{display:flex}
.pane .ph{background:var(--pri);color:#fff;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 10px}
.pane .pb{padding-bottom:calc(40px + env(safe-area-inset-bottom))!important}
.pane .ph h2{flex:1;margin:0;font-size:17px}
.pane .ph button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:9px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer}
.pane .pb{flex:1;overflow:auto;padding:12px 12px 40px}
.pane .pb>div{max-width:720px;margin:0 auto}
/* overlay xem phiếu */
.ov{position:fixed;inset:0;z-index:50;background:#2a3440;display:none;flex-direction:column}
.ov.on{display:flex}
.ov .bar{display:flex;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 10px 10px;background:#1c242d;flex-wrap:wrap}
.ov .scroll{padding-bottom:calc(20px + env(safe-area-inset-bottom))!important}
.ov .bar .btn{flex:1;min-width:0;padding:10px 6px;font-size:14px}
.ov .scroll{flex:1;overflow:auto;padding:12px}
#sheetWrap{margin:0 auto;position:relative}
#sheetWrap .sheet{transform-origin:top left;position:absolute;left:0;top:0;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,25,35,.5);display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;padding:18px;max-width:380px;width:100%;max-height:90%;overflow:auto}
.modal .box p{margin:0 0 16px;line-height:1.5}
.modal .box .row{justify-content:flex-end}
.modal img{max-width:100%;border:1px solid var(--line);border-radius:8px}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d2733;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1}
/* phiếu A4 */
.sheet{width:794px;background:#fff;color:#1d2733;padding:40px 44px;font-family:'Be Vietnam Pro',sans-serif;font-size:12.5px;line-height:1.45}
.sheet .hd{display:flex;gap:16px;align-items:flex-start;border-bottom:3px solid #0f5c8c;padding-bottom:12px}
.sheet .hd img{max-height:68px;max-width:150px}
.sheet .co b{font-size:16px;color:#0f5c8c;text-transform:uppercase;display:block;margin-bottom:3px}
.sheet .co div{font-size:12px;color:#44515e}
.sheet .tt{text-align:center;margin:20px 0 4px;font-size:23px;font-weight:700;color:#0f5c8c;letter-spacing:1px}
.sheet .sub{text-align:center;color:#55626f;font-size:12.5px;margin-bottom:16px}
.sheet .kh{background:#f2f6fa;border-radius:8px;padding:9px 14px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:4px 24px}
.sheet h4{margin:14px 0 6px;font-size:13px;color:#0f5c8c;text-transform:uppercase}
.sheet table{width:100%;border-collapse:collapse;font-size:12px}
.sheet th{background:#0f5c8c;color:#fff;font-weight:600;padding:7px 5px;text-align:center}
.sheet td{border-bottom:1px solid #dfe5eb;padding:6px 5px;vertical-align:top}
.sheet td.c{text-align:center}.sheet td.r{text-align:right;white-space:nowrap}
.sheet tr:nth-child(even) td{background:#fafcfd}
.sheet tr.st td{font-weight:700;background:#eef3f8;border-bottom:0}
.sheet .tot{margin-left:auto;width:360px;margin-top:14px}
.sheet .tot div{display:flex;justify-content:space-between;padding:4px 6px}
.sheet .tot .g{background:#0f5c8c;color:#fff;font-weight:700;font-size:14.5px;border-radius:6px;padding:8px 10px;margin-top:4px}
.sheet .bc{margin-top:10px;font-style:italic}
.sheet .sg{display:flex;justify-content:space-between;margin-top:30px;text-align:center}
.sheet .sg div{width:45%}.sheet .sg b{display:block}.sheet .sg i{font-size:11.5px;color:#6b7785}
.sheet .sg .nm{margin-top:66px;font-weight:600}
</style>
</head>
<body>
<header class="top"><h1 class="brand"><span class="emb"><img id="hdLogo" alt="Safe Lock"></span>Sổ Công Thợ</h1><span id="sync">Đang mở…</span></header>
<main id="main"></main>

<div class="sumbar" id="sumbar">
  <div class="t"><small id="sum-label">Tổng phải trả thợ</small><b id="sum-total" class="num">0 đ</b></div>
  <button class="btn" id="b-add">＋ Ghi</button>
  <button class="btn pri" id="b-preview">Xem &amp; xuất</button>
</div>

<nav class="tabs" id="tabs">
  <button data-tab="log" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Nhật ký</button>
  <button data-tab="sum"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>Chốt công</button>
  <button data-tab="workers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 1 0 0-6M22 21c0-3-2-5-5-5.5"/></svg>Thợ</button>
  <button data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Cài đặt</button>
</nav>

<div class="pane" id="pane"><div class="ph"><button id="p-close">✕</button><h2 id="p-title"></h2><button id="p-save">Lưu</button></div><div class="pb"><div id="p-body"></div></div></div>

<div class="ov" id="ov">
  <div class="bar">
    <button class="btn" id="o-close">✕ Đóng</button>
    <button class="btn acc" id="o-png">🖼 Ảnh</button>
    <button class="btn pri" id="o-pdf">📄 PDF</button>
    <button class="btn" id="o-xlsx">📊 Excel</button>
    <button class="btn" id="o-copy">📋 Chép</button>
  </div>
  <div class="scroll"><div id="sheetWrap"></div></div>
</div>

<div class="modal" id="modal"><div class="box"><p id="m-text"></p><div id="m-extra"></div><div class="row" id="m-btns"></div></div></div>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(+n||0).toLocaleString('vi-VN');
const fmtQ=n=>(+n||0).toLocaleString('vi-VN',{maximumFractionDigits:2});
const pMoney=s=>Number(String(s||'').replace(/[^\d]/g,''))||0;
const pNum=s=>{const v=parseFloat(String(s).replace(/\s/g,'').replace(',','.'));return isFinite(v)?v:0};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dmy=s=>{if(!s)return'';const[y,m,d]=s.split('-');return d+'/'+m+'/'+y};
const clone=o=>JSON.parse(JSON.stringify(o??{}));
const uid=p=>p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const noAccent=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D');
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}
function dialog(text,btns,extra){return new Promise(res=>{$('#m-text').textContent=text;$('#m-extra').innerHTML=extra||'';const b=$('#m-btns');b.innerHTML='';btns.forEach(([l,v,c])=>{const e=document.createElement('button');e.className='btn '+(c||'');e.textContent=l;e.onclick=()=>{$('#modal').classList.remove('on');res(v)};b.appendChild(e)});$('#modal').classList.add('on')})}
const WD=['CN','T2','T3','T4','T5','T6','T7'];
function dayLabel(s){const d=new Date(s+'T00:00:00');const t=new Date();const y=new Date();y.setDate(y.getDate()-1);
  if(s===ymd(t))return'Hôm nay · '+dmy(s);if(s===ymd(y))return'Hôm qua · '+dmy(s);return WD[d.getDay()]+' · '+dmy(s)}

/* ---------- số thành chữ ---------- */
const CS=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
function doc3(n,full){const tr=Math.floor(n/100),ch=Math.floor(n%100/10),dv=n%10,s=[];
  if(full||tr>0)s.push(CS[tr]+' trăm');
  if(ch>1){s.push(CS[ch]+' mươi');if(dv===1)s.push('mốt');else if(dv===5)s.push('lăm');else if(dv>0)s.push(CS[dv])}
  else if(ch===1){s.push('mười');if(dv===5)s.push('lăm');else if(dv>0)s.push(CS[dv])}
  else if(dv>0){if(full||tr>0)s.push('lẻ');s.push(CS[dv])}
  return s.join(' ')}
function bangChu(n){n=Math.round(Math.abs(n||0));if(!n)return'Không đồng';
  const U=['','nghìn','triệu','tỷ','nghìn tỷ'],g=[];while(n>0){g.push(n%1000);n=Math.floor(n/1000)}
  const out=[];let first=true;for(let i=g.length-1;i>=0;i--){if(g[i]===0)continue;out.push(doc3(g[i],!first)+(U[i]?' '+U[i]:''));first=false}
  const s=out.join(' ')+' đồng';return s.charAt(0).toUpperCase()+s.slice(1)}

const DEFAULT_SERVICES=[

const ui={tab:'log',preset:'month',from:'',to:'',worker:''};

function rangeFor(p){const t=new Date(),y=t.getFullYear(),m=t.getMonth();
  if(p==='today')return[ymd(t),ymd(t)];
  if(p==='week'){const d=new Date(t);d.setDate(d.getDate()-((d.getDay()+6)%7));const e=new Date(d);e.setDate(e.getDate()+6);return[ymd(d),ymd(e)]}
  if(p==='h1')return[ymd(new Date(y,m,1)),ymd(new Date(y,m,15))];
  if(p==='h2')return[ymd(new Date(y,m,16)),ymd(new Date(y,m+1,0))];
  if(p==='month')return[ymd(new Date(y,m,1)),ymd(new Date(y,m+1,0))];
  if(p==='lastmonth')return[ymd(new Date(y,m-1,1)),ymd(new Date(y,m,0))];
  return[ui.from,ui.to]}
function applyPreset(p){ui.preset=p;if(p!=='custom'){const[a,b]=rangeFor(p);ui.from=a;ui.to=b}}
applyPreset('month');

const company=()=>{const c={name:'SAFE LOCK',address:'',phone:'',email:'',bank:'',rep:'',...((docs.company)||{})};if(!c.logo)c.logo=DEFAULT_LOGO;if(!c.name)c.name='SAFE LOCK';return c};
const initials=n=>String(n||'?').trim().split(/\s+/).slice(-1)[0].charAt(0).toUpperCase()||'?';
function avatar(w,size){const s=size||40;const st=`width:${s}px;height:${s}px;font-size:${Math.round(s*.4)}px`;
  return w&&w.photo?`<span class="av" style="${st}"><img src="${w.photo}" alt=""></span>`:`<span class="av" style="${st}">${esc(initials(w&&w.name))}</span>`}
function services(){const s=docs.settings;return(s&&Array.isArray(s.services)&&s.services.length)?s.services:DEFAULT_SERVICES}
function workers(all){return Object.entries(docs).filter(([,d])=>d&&d.kind==='worker'&&(all||d.active!==false)).map(([id,d])=>({...d,id})).sort((a,b)=>a.name.localeCompare(b.name,'vi'))}
const wName=id=>{const w=docs[id];return w&&w.kind==='worker'?w.name:'(thợ đã xoá)'};
const jobTotal=j=>(j.lines||[]).reduce((s,l)=>s+(+l.qty||0)*(+l.price||0),0);
function entriesIn(from,to,wid){return Object.entries(docs).filter(([,d])=>d&&['job','thu','chi'].includes(d.kind)&&d.date>=from&&d.date<=to&&(!wid||d.workerId===wid)).map(([id,d])=>({...d,id})).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:((a.createdAt||0)-(b.createdAt||0)))}
function summarize(list){const per={};const g=w=>per[w]||(per[w]={workerId:w,cong:0,thu:0,chi:0,jobs:0,svc:{},chiBy:{}});
  for(const e of list){const p=g(e.workerId);
    if(e.kind==='job'){p.jobs++;p.cong+=jobTotal(e);p.thu+=(+e.thu||0);for(const l of e.lines||[]){const k=l.name+'|'+(l.unit||'');p.svc[k]=(p.svc[k]||0)+(+l.qty||0)}}
    else if(e.kind==='thu')p.thu+=(+e.amount||0);
    else{p.chi+=(+e.amount||0);p.chiBy[e.cat]=(p.chiBy[e.cat]||0)+(+e.amount||0)}}
  Object.values(per).forEach(p=>p.pay=p.cong+p.chi-p.thu);
  return Object.values(per).sort((a,b)=>wName(a.workerId).localeCompare(wName(b.workerId),'vi'))}
const totalsOf=s=>s.reduce((a,p)=>({cong:a.cong+p.cong,thu:a.thu+p.thu,chi:a.chi+p.chi,pay:a.pay+p.pay,jobs:a.jobs+p.jobs}),{cong:0,thu:0,chi:0,pay:0,jobs:0});

/* ---------- lưu trữ ---------- */
function setSync(t){$('#sync').textContent=t}
/* Lưu trên iPhone bằng IndexedDB (dung lượng lớn), dự phòng localStorage */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('socongtho',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  get(k){return new Promise((res,rej)=>{const t=this.db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})},
  set(k,v){return new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}};
let saving=Promise.resolve();
function persist(){const snap=docs;saving=saving.then(async()=>{
  try{if(IDB.db)await IDB.set('docs',snap);else LS.set(LSK,snap)}catch(e){toast('Chưa lưu được — bộ nhớ máy có thể đã đầy')}})}
async function put(id,obj){docs={...docs,[id]:obj};render();persist()}
async function remove(id){const d={...docs};delete d[id];docs=d;render();persist()}
async function init(){
  render();
  const limit=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
  try{await limit(IDB.open(),4000);let d=await limit(IDB.get('docs'),4000);
    if(!d){d=LS.get(LSK,null);if(d)await IDB.set('docs',d)}
    docs=d||{}}catch(e){IDB.db=null;docs=LS.get(LSK,{})}
  mode='local';setSync('📱 Lưu trên máy');render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(!(window.navigator.standalone||matchMedia('(display-mode: standalone)').matches)&&!LS.get('hintShown',false)){
    LS.set('hintShown',true);
    dialog('Để dùng như app: trong Safari bấm nút Chia sẻ (ô vuông có mũi tên) → "Thêm vào MH chính". Lần sau mở bằng biểu tượng Sổ Công trên màn hình.',[['Đã hiểu',true,'pri']])}
}

document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab;render();window.scrollTo(0,0)});
function periodCard(){
  const ws=workers(true);
  return `<div class="card"><div class="chips">${PRESETS.map(([k,l])=>`<button class="chip ${ui.preset===k?'on':''}" data-preset="${k}">${l}</button>`).join('')}</div>
  ${ui.preset==='custom'?`<div class="row"><div><label for="fFrom">Từ ngày</label><input type="date" id="fFrom" value="${ui.from}"></div><div><label for="fTo">Đến ngày</label><input type="date" id="fTo" value="${ui.to}"></div></div>`:`<div class="hint">Từ ${dmy(ui.from)} đến ${dmy(ui.to)}</div>`}
  ${ws.length?`<label for="fWorker">Thợ</label><select id="fWorker"><option value="">Tất cả thợ</option>${ws.map(w=>`<option value="${w.id}" ${ui.worker===w.id?'selected':''}>${esc(w.name)}${w.active===false?' (nghỉ)':''}</option>`).join('')}</select>`:''}</div>`}
function bindPeriod(){
  document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{applyPreset(b.dataset.preset);render()});
  const f=$('#fFrom'),t=$('#fTo'),w=$('#fWorker');
  if(f)f.onchange=()=>{ui.from=f.value;render()};if(t)t.onchange=()=>{ui.to=t.value;render()};if(w)w.onchange=()=>{ui.worker=w.value;render()}}
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab));
  const m=$('#main');const showBar=ui.tab==='log'||ui.tab==='sum';$('#sumbar').style.display=showBar?'flex':'none';
  if(showBar){const t=totalsOf(summarize(entriesIn(ui.from,ui.to,ui.worker)));$('#sum-label').textContent=t.pay>=0?'Tổng phải trả thợ':'Thợ phải nộp lại';$('#sum-total').textContent=fmt(Math.abs(t.pay))+' đ'}
  if(ui.tab==='log')renderLog(m);else if(ui.tab==='sum')renderSum(m);else if(ui.tab==='workers')renderWorkers(m);else renderSettings(m);
}
function entHTML(e){const wn=esc(wName(e.workerId));
  if(e.kind==='job')return `<button class="ent" data-edit="${e.id}"><span class="tg job">Công</span><div class="mn"><b>${wn}</b><span>${(e.lines||[]).map(l=>esc(l.name)+' ×'+fmtQ(l.qty)).join(', ')}${e.customer?' · '+esc(e.customer):''}${e.address?' · '+esc(e.address):''}</span></div><div class="am num">${fmt(jobTotal(e))} đ${+e.thu?`<small class="minus">Thu hộ ${fmt(e.thu)} đ</small>`:''}</div></button>`;
  if(e.kind==='thu')return `<button class="ent" data-edit="${e.id}"><span class="tg thu">Thu hộ</span><div class="mn"><b>${wn}</b><span>${esc(e.customer||'Khách')}${e.note?' · '+esc(e.note):''}</span></div><div class="am num minus">−${fmt(e.amount)} đ</div></button>`;
  return `<button class="ent" data-edit="${e.id}"><span class="tg chi">Chi hộ</span><div class="mn"><b>${wn}</b><span>${esc(e.cat)}${e.party?' · '+esc(e.party):''}${e.note?' · '+esc(e.note):''}</span></div><div class="am num plus">+${fmt(e.amount)} đ</div></button>`}
function renderLog(m){
  const list=entriesIn(ui.from,ui.to,ui.worker);let h=periodCard();
  if(!workers().length)h+=`<div class="card empty"><b>Bắt đầu bằng việc thêm thợ</b>Thêm tên các thợ, sau đó ghi công lắp, thu hộ và chi hộ cho từng người.<div style="margin-top:14px"><button class="btn pri" id="goW">＋ Thêm thợ đầu tiên</button></div></div>`;
  else if(!list.length)h+=`<div class="card empty"><b>Chưa có công trong khoảng này</b>Nhấn <b style="display:inline">＋ Ghi</b> ở dưới để ghi công lắp, thu hộ hoặc chi hộ.</div>`;
  else{const by={};list.forEach(e=>(by[e.date]=by[e.date]||[]).push(e));Object.keys(by).sort().reverse().forEach(d=>{h+=`<div class="day">${dayLabel(d)}</div>`+by[d].slice().reverse().map(entHTML).join('')})}
  m.innerHTML=h;bindPeriod();
  const g=$('#goW');if(g)g.onclick=()=>openWorker();
  m.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const e=docs[b.dataset.edit];if(!e)return;e.kind==='job'?openJob(b.dataset.edit):openMoney(e.kind,b.dataset.edit)})}
function renderSum(m){
  const s=summarize(entriesIn(ui.from,ui.to,ui.worker)),t=totalsOf(s);
  let h=periodCard();
  h+=`<div class="card"><h2>Tổng hợp kỳ này</h2><div class="tiles num">
    <div class="tile"><small>Tiền công (${t.jobs} việc)</small><b>${fmt(t.cong)} đ</b></div>
    <div class="tile"><small>Số thợ</small><b>${s.length}</b></div>
    <div class="tile"><small>Chi hộ (cộng)</small><b class="plus">${fmt(t.chi)} đ</b></div>
    <div class="tile"><small>Thu hộ khách (trừ)</small><b class="minus">${fmt(t.thu)} đ</b></div>
    <div class="tile big"><small>${t.pay>=0?'Tổng phải trả thợ':'Thợ phải nộp lại'}</small><b>${fmt(Math.abs(t.pay))} đ</b></div></div></div>`;
  if(!s.length)h+=`<div class="card empty"><b>Không có dữ liệu để chốt</b>Chọn khoảng thời gian khác hoặc ghi công ở tab Nhật ký.</div>`;
  else h+=s.map(p=>{const tags=Object.entries(p.svc).map(([k,q])=>{const[n,u]=k.split('|');return`<span>${esc(n)}: ${fmtQ(q)} ${esc(u)}</span>`}).join('');
    return `<div class="card wk"><div class="h"><div class="who">${avatar(docs[p.workerId],40)}<b>${esc(wName(p.workerId))}</b></div><span>${p.jobs} việc</span></div>${tags?`<div class="tags">${tags}</div>`:''}
    <div class="totals num"><div><span>Tiền công</span><span>${fmt(p.cong)} đ</span></div>
    <div><span>Cộng chi hộ</span><span class="plus">+${fmt(p.chi)} đ</span></div>
    <div><span>Trừ thu hộ khách</span><span class="minus">−${fmt(p.thu)} đ</span></div>
    <div class="g"><span>${p.pay>=0?'Thực trả thợ':'Thợ nộp lại'}</span><span>${fmt(Math.abs(p.pay))} đ</span></div></div>
    <div class="words">${bangChu(p.pay)}</div>
    <div class="a"><button class="btn sm pri" data-view="${p.workerId}">Xem &amp; xuất phiếu</button></div></div>`}).join('')
    +`<div class="hint" style="padding:0 4px">Cách tính: <b>Thực trả = Tiền công + Chi hộ − Thu hộ</b>. Thu hộ là tiền thợ đã cầm của khách nên trừ đi, chi hộ là tiền thợ đã ứng trả thay nên cộng lại.</div>`;
  m.innerHTML=h;bindPeriod();
  m.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>openPreview(b.dataset.view))}
function renderWorkers(m){
  const ws=workers(true);const[a,b]=rangeFor('month');const by={};summarize(entriesIn(a,b)).forEach(p=>by[p.workerId]=p);
  m.innerHTML=`<div class="card"><h2>Danh sách thợ (${ws.length})</h2>${ws.length?ws.map(w=>`<button class="wrow" data-w="${w.id}"><div class="who">${avatar(w,44)}<div><b>${esc(w.name)}${w.active===false?'<span class="off">Đã nghỉ</span>':''}</b><span>${esc(w.phone||'Chưa có SĐT')}${w.note?' · '+esc(w.note):''}</span></div></div><div style="text-align:right" class="num"><b>${fmt(by[w.id]?by[w.id].pay:0)} đ</b><span>tháng này</span></div></button>`).join(''):'<div class="empty">Chưa có thợ nào.</div>'}
  <button class="btn ghost" id="addW" style="margin-top:10px">＋ Thêm thợ</button></div>`;
  m.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>openWorker(b.dataset.w));$('#addW').onclick=()=>openWorker()}
function renderSettings(m){

    <div class="row"><button class="btn" id="backup">⬇ Tải sao lưu</button><label class="btn" for="restoreIn" style="margin:0;color:var(--txt);font-size:15px">⬆ Khôi phục</label></div>

const svcRow=s=>`<div class="prod" data-id="${esc(s.id)}"><input class="s-n" aria-label="Tên công việc" value="${esc(s.name)}" placeholder="VD: Lắp khoá vân tay"><input class="s-p money num" inputmode="numeric" aria-label="Đơn giá" value="${fmt(s.price)}"><input class="s-u" aria-label="Đơn vị" value="${esc(s.unit||'bộ')}"><button data-rm aria-label="Xoá">×</button></div>`;
function bindMoney(root){root.querySelectorAll('input.money').forEach(i=>{if(i._b)return;i._b=1;i.addEventListener('input',()=>{const v=pMoney(i.value);i.value=v?fmt(v):'';i.dispatchEvent(new Event('recalc',{bubbles:true}))})})}
function resizeImg(file,max,square){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const x=c.getContext('2d');
  if(square){const m=Math.min(img.width,img.height);c.width=c.height=Math.min(max,m);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82));return}
  const s=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);x.drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/png'))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

/* ---------- màn nhập ---------- */
let paneSave=null;
function openPane(title,html,onSave){$('#p-title').textContent=title;$('#p-body').innerHTML=html;paneSave=onSave;$('#pane').classList.add('on');$('#pane .pb').scrollTop=0;bindMoney($('#p-body'))}

$('#p-close').onclick=closePane;$('#p-save').onclick=()=>paneSave&&paneSave();

const delBtn=id=>id?`<button class="btn red full" id="p-del" style="margin-top:4px">🗑 Xoá mục này</button>`:'';

$('#b-add').onclick=async()=>{if(needWorker())return;

  if(!e.lines.length){const s=services()[0];e.lines=[{serviceId:s.id,name:s.name,unit:s.unit,price:s.price,qty:1}]}

  <div class="card"><h2>Công việc</h2><div id="lines">${e.lines.map(lineHTML).join('')}</div><button class="btn ghost" id="addL">＋ Thêm công việc</button>
  <div class="totals num" style="margin-top:10px"><div class="g"><span>Tiền công</span><span id="jTot"></span></div></div></div>
  <div class="card"><h2>Thu hộ tiền khách</h2><input id="jThu" class="money num" inputmode="numeric" value="${e.thu?fmt(e.thu):''}" placeholder="0 (nếu thợ có thu tiền khách)"><div class="hint">Số tiền thợ nhận của khách, sẽ trừ khi chốt công.</div></div>
  <div class="card"><h2>Ghi chú</h2><textarea id="jNote">${esc(e.note||'')}</textarea></div>

function offer(blob,filename){
  const ext=filename.split('.').pop();const file=new File([blob],filename,{type:MIME[ext]||'application/octet-stream'});
  const canShare=navigator.canShare&&navigator.canShare({files:[file]});
  $('#m-text').textContent='Đã tạo xong: '+filename;
  $('#m-extra').innerHTML='<div class="hint" style="margin:-8px 0 14px">'+(canShare?'Bấm Chia sẻ / Lưu để gửi qua Zalo, Messenger hoặc lưu vào Tệp.':'Bấm Tải về để lưu file.')+'</div>';
  const b=$('#m-btns');b.innerHTML='';
  const close=document.createElement('button');close.className='btn';close.textContent='Đóng';close.onclick=()=>$('#modal').classList.remove('on');
  const go=document.createElement('button');go.className='btn pri';go.textContent=canShare?'Chia sẻ / Lưu':'Tải về';
  go.onclick=async()=>{
    if(canShare){try{await navigator.share({files:[file],title:filename});$('#modal').classList.remove('on');return}catch(e){if(e&&e.name==='AbortError')return}}
    const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);$('#modal').classList.remove('on')};
  b.append(close,go);$('#modal').classList.add('on')}

  n=0;list.forEach(e=>{if(e.kind==='job'&&+e.thu)R.push([++n,dmy(e.date),e.customer||'','Thu kèm công lắp','','','',+e.thu]);else if(e.kind==='thu')R.push([++n,dmy(e.date),e.customer||'',e.note||'Thu hộ','','','',+e.amount])});
  R.push(['','','','','','','Cộng B',p.thu],[],['C. CHI HỘ (cộng)'],['STT','Ngày','Loại chi','Đơn vị / nội dung','Ghi chú','','','Số tiền']);
  n=0;list.filter(e=>e.kind==='chi').forEach(e=>R.push([++n,dmy(e.date),e.cat||'',e.party||'',e.note||'','','',+e.amount]));
  R.push(['','','','','','','Cộng C',p.chi],[],['','','','','','','Tiền công (A)',p.cong],['','','','','','','+ Chi hộ (C)',p.chi],['','','','','','','− Thu hộ (B)',p.thu],['','','','','','',p.pay>=0?'THỰC TRẢ THỢ':'THỢ NỘP LẠI',Math.abs(p.pay)],['Bằng chữ: '+bangChu(p.pay)],[],['','Thợ xác nhận','','','','Người lập phiếu']);
  return wsFrom(R,[6,7],5,[5,11,22,24,24,6,14,16])}
function buildXlsx(wid){
  const wb=XLSX.utils.book_new();const used=new Set();
  if(wid){XLSX.utils.book_append_sheet(wb,workerRows(wid),sheetName(wName(wid),used))}
  else{const s=summarize(entriesIn(ui.from,ui.to,'')),t=totalsOf(s);
    const R=[[company().name||''],['BẢNG TỔNG HỢP CHỐT CÔNG'],['Kỳ từ '+dmy(ui.from)+' đến '+dmy(ui.to)],[],['STT','Thợ','Số việc','Tiền công','Chi hộ (+)','Thu hộ (−)','Thực trả']];
    s.forEach((p,i)=>R.push([i+1,wName(p.workerId),p.jobs,p.cong,p.chi,p.thu,p.pay]));R.push(['','TỔNG CỘNG',t.jobs,t.cong,t.chi,t.thu,t.pay]);
    XLSX.utils.book_append_sheet(wb,wsFrom(R,[3,4,5,6],5,[5,22,9,15,15,15,16]),sheetName('Tong hop',used));
    s.forEach(p=>XLSX.utils.book_append_sheet(wb,workerRows(p.workerId),sheetName(wName(p.workerId),used)))}
  return XLSX.write(wb,{bookType:'xlsx',type:'array'})}

init();
